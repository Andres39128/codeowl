version: "2"
sql:
  - engine: "postgresql"
    # El schema vive en las migraciones forward-only (guía §3.3) — única
    # fuente del DDL; incluye el schema oficial de River.
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
