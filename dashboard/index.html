<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codeowl</title>
    <script>
      // Aplica el tema antes del primer paint para evitar FOUC (guía §5.1):
      // localStorage manda; sin valor, prefiere prefers-color-scheme. La
      // clave se repite acá porque este script debe correr inline y síncrono;
      // el canonical es THEME_STORAGE_KEY en src/theme/theme.ts.
      (() => {
        var stored = null;
        try {
          stored = localStorage.getItem("codeowl-theme");
        } catch {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
