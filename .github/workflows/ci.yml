# CI de Fase 0 (guia 6 F0): lint + build + test en backend y dashboard,
# reutilizando las recetas del justfile (guia 3.2).
# Reglas de tests (guia 8): CI determinista - sin llamadas a proveedores LLM reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # backend/cmd aterriza con el esqueleto de API de F0: el job se activa solo
    # cuando exista backend/cmd/api/main.go.
    runs-on: ubuntu-latest
    steps:
      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        uses: actions/checkout@v4

      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        uses: extractions/setup-just@v2

      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.27" # guia 2 (stack): Go 1.27

      - name: Install golangci-lint
        # v2.14.0 es la primera linea construida con go1.27 - versiones previas
        # rechazan un modulo `go 1.27`.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh |
            sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        run: just lint backend
      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        run: just build backend
      - if: ${{ hashFiles('backend/cmd/api/main.go') != '' }}
        run: just test backend

  dashboard:
    # dashboard/ aterriza con el shell de F0 (guia 6): el job se activa solo
    # cuando exista dashboard/package.json.
    runs-on: ubuntu-latest
    steps:
      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        uses: actions/checkout@v4

      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        uses: extractions/setup-just@v2

      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm --dir dashboard install --frozen-lockfile

      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        run: just lint dashboard
      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        run: just build dashboard
      - if: ${{ hashFiles('dashboard/package.json') != '' }}
        run: just test dashboard
